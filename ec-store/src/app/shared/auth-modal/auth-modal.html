@if (isOpen()) {
  <div
    class="auth-modal-overlay"
    (click)="onBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    aria-labelledby="auth-modal-title"
  >
    <div class="auth-modal-card">
      <!-- Glow effect -->
      <div class="glow-orb glow-top"></div>
      <div class="glow-orb glow-bottom"></div>

      <!-- Close Button -->
      <button
        type="button"
        class="modal-close-btn"
        (click)="close()"
        aria-label="Close modal"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- Modal Brand & Lock Icon Badge -->
      <div class="modal-badge-row">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
      </div>

      <!-- Modal Content Header -->
      <div class="modal-header-content">
        <h2 id="auth-modal-title" class="modal-title">{{ title() }}</h2>
        <p class="modal-message">{{ message() }}</p>
      </div>

      <!-- Perks Strip (Ecommerce Platform Features) -->
      <div class="features-strip">
        <div class="feature-item">
          <span class="feature-icon">🛒</span>
          <span class="feature-text">Persistent Cart</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">❤️</span>
          <span class="feature-text">Saved Wishlist</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">📦</span>
          <span class="feature-text">Order Tracking</span>
        </div>
      </div>

      <!-- Standard Prompt State -->
      @if (!showQuickLogin()) {
        <!-- Actions: Login & Create Account -->
        <div class="modal-actions">
          <button
            type="button"
            class="btn-modal btn-login"
            (click)="handleLoginClick()"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Login</span>
          </button>

          <button
            type="button"
            class="btn-modal btn-register"
            (click)="handleRegisterClick()"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span>Create Account</span>
          </button>
        </div>

        <!-- Quick Login Expand Option -->
        <div class="quick-toggle-wrap">
          <button
            type="button"
            class="btn-quick-toggle"
            (click)="toggleQuickLogin()"
          >
            <span>⚡ Quick Sign In without leaving this page</span>
          </button>
        </div>
      } @else {
        <!-- Quick Inline Sign-In Form -->
        <form class="quick-login-form" (ngSubmit)="submitQuickLogin()">
          <div class="quick-form-title">
            <span>Instant Sign In</span>
            <button
              type="button"
              class="btn-cancel-quick"
              (click)="toggleQuickLogin()"
            >
              Back
            </button>
          </div>

          @if (quickError) {
            <div class="quick-alert alert-danger" role="alert">
              {{ quickError }}
            </div>
          }

          @if (quickSuccess) {
            <div class="quick-alert alert-success" role="alert">
              {{ quickSuccess }}
            </div>
          }

          <div class="form-group">
            <label for="modal-quick-email">Email Address</label>
            <input
              id="modal-quick-email"
              type="email"
              [(ngModel)]="quickEmail"
              name="quickEmail"
              placeholder="Enter your email"
              required
              class="modal-input"
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="modal-quick-password">Password</label>
            <input
              id="modal-quick-password"
              type="password"
              [(ngModel)]="quickPassword"
              name="quickPassword"
              placeholder="Enter your password"
              required
              class="modal-input"
              autocomplete="current-password"
            />
          </div>

          <div class="quick-actions">
            <button
              type="submit"
              class="btn-modal btn-login btn-full"
              [disabled]="quickLoading"
            >
              @if (!quickLoading) {
                <span>Sign In & Continue</span>
              } @else {
                <span class="btn-spinner"></span>
                <span>Signing in...</span>
              }
            </button>
          </div>
        </form>
      }

      <!-- Trust Assurance Footer -->
      <div class="modal-footer-trust">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>100% Safe & Secure Ecommerce Experience</span>
      </div>
    </div>
  </div>
}
